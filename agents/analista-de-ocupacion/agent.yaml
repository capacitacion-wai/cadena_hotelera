category: operations
connectors:
- enabled: true
  mode: inherit
  name: conector-del-gestor-de-ocupacion
description: Ayuda a Dirección a detectar sobreventas en los cinco hoteles y a preparar propuestas de
  reubicación motivadas.
execution:
  compaction:
    auto: true
    prune: true
  marketplace_publisher_intent: null
  max_iterations: 50
  max_steps: 100
  permissions:
    '*': allow
  resource_limits:
    cpu: 2
    memory_gb: 4
  sandbox: docker
  timeout_s: 300
  write_policy: write_with_approval
icon: fa-hotel
name: analista-de-ocupacion
tags:
- hoteles
- ocupacion
- sobreventa
title: Analista de ocupación
variables: []
version: 0.0.2
