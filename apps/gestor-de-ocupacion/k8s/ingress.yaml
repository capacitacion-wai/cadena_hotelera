apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-gestor-de-ocupacion-ingress
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gestor-de-ocupacion-demo.usewai.com
      secretName: demo-gestor-de-ocupacion-tls
  rules:
    - host: gestor-de-ocupacion-demo.usewai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-gestor-de-ocupacion-service
                port:
                  number: 8080
